<script>
    (function() {
        // 🔥 ESTABLECER COLOR DE FONDO INMEDIATAMENTE EN HTML Y BODY
        document.documentElement.style.background = 'rgba(1, 1, 1, 1)';
        document.body.style.background = 'rgba(1, 1, 1, 1)';
        
        var theme = localStorage.getItem('chainfeed_theme') || 'dark';
        document.documentElement.className = theme + '-theme';
        document.documentElement.setAttribute('data-theme', theme);
        
        if (theme === 'light') {
            // Modo claro
            document.documentElement.style.background = '#f0f0eb';
            document.body.style.background = '#f0f0eb';
            
            var s = document.createElement('style');
            s.id = 'preload-theme';
            s.textContent = ':root{--dark:#f0f0eb;--dark-secondary:#e5e5db;--dark-tertiary:#dadacd;--text-primary:#875ba9;--primary:#4f46e5}body,html{background:#f0f0eb!important}';
            document.head.appendChild(s);
        } else {
            // Modo oscuro
            var s = document.createElement('style');
            s.id = 'preload-theme';
            s.textContent = 'body,html{background:rgba(1, 1, 1, 1)!important}';
            document.head.appendChild(s);
        }
    })();
</script>

    <style>
    
    /* Prevenir flash de tema */
body {
    transition: opacity 0.15s ease-in;
}

/* Mientras carga el tema, ocultar brevemente */
body:not(.light-theme):not(.dark-theme) {
    opacity: 0;
}

body.light-theme,
body.dark-theme {
    opacity: 1;
}

        body, html {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0f0f14;
            color: #ffffff;
            height: 100%;
            overflow: hidden;
        }
        
        #chat-root {
            width: 100%;
            height: 100vh;
        }
        
        .loading-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            gap: 20px;
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(99, 102, 241, 0.3);
            border-radius: 50%;
            border-top-color: #6366f1;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loading-text {
            color: #a0a0b8;
            font-size: 1.2rem;
        }
        
        .error-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            gap: 20px;
            color: #ef4444;
            text-align: center;
        }
        
        .retry-btn {
            background: #6366f1;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
        }
        
        .retry-btn:hover {
            background: #5856eb;
        }
        /* ESTILOS PARA MODAL DE ELIMINAR CHAT */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: rgba(0, 0, 0, 0.8);
  backdrop-filter: blur(10px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10000;
  animation: modalOverlayFadeIn 0.3s ease;
}

@keyframes modalOverlayFadeIn {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}

.modal-content {
  background: rgba(26, 26, 36, 0.98);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 20px;
  padding: 0;
  width: 90%;
  max-width: 500px;
  max-height: 80vh;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
  animation: modalContentSlideIn 0.3s ease;
}

@keyframes modalContentSlideIn {
  from {
    opacity: 0;
    transform: translateY(-20px) scale(0.95);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.modal-header {
  padding: 2rem 2rem 1rem;
  text-align: center;
}

.modal-header h3 {
  margin: 0;
  font-size: 1.4rem;
  font-weight: 700;
  color: #ef4444;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
}

.modal-header h3::before {
  content: '🗑️';
  font-size: 1.6rem;
}

.modal-body {
  padding: 0 2rem 1.5rem;
  text-align: center;
  color: #ffffff;
}

.modal-body p {
  margin: 0 0 1.5rem;
  font-size: 1rem;
  line-height: 1.5;
  color: #e5e5e5;
}

.modal-info {
  background: rgba(37, 37, 50, 0.5);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 12px;
  padding: 1.5rem;
  text-align: left;
  margin-top: 1rem;
}

.modal-info p {
  margin: 0.5rem 0;
  font-size: 0.9rem;
  color: #a0a0b8;
  display: flex;
  align-items: flex-start;
  gap: 0.5rem;
}

.modal-actions {
  padding: 1.5rem 2rem 2rem;
  display: flex;
  gap: 1rem;
  justify-content: center;
}

.modal-btn-cancel,
.modal-btn-delete {
  padding: 0.8rem 2rem;
  border-radius: 12px;
  font-weight: 600;
  font-size: 1rem;
  cursor: pointer;
  transition: all 0.3s ease;
  border: none;
  min-width: 120px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
}

.modal-btn-cancel {
  background: rgba(107, 114, 128, 0.1);
  border: 1px solid rgba(107, 114, 128, 0.3);
  color: #9ca3af;
}

.modal-btn-cancel:hover {
  background: rgba(107, 114, 128, 0.2);
  transform: translateY(-1px);
  box-shadow: 0 4px 15px rgba(107, 114, 128, 0.2);
}

.modal-btn-delete {
  background: linear-gradient(135deg, #ef4444, #dc2626);
  color: white;
}

.modal-btn-delete:hover {
  background: linear-gradient(135deg, #dc2626, #b91c1c);
  transform: translateY(-1px);
  box-shadow: 0 8px 25px rgba(239, 68, 68, 0.4);
}

.modal-btn-delete:active {
  transform: translateY(0);
}

/* BOTÓN DE ELIMINAR CHAT EN HEADER */
.delete-chat-btn {
  background: rgba(239, 68, 68, 0.1);
  border: 1px solid rgba(239, 68, 68, 0.3);
  color: #ef4444;
  padding: 0.6rem;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.3s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  font-size: 1.1rem;
}

.delete-chat-btn:hover {
  background: rgba(239, 68, 68, 0.2);
  transform: scale(1.05);
}

/* ESTILOS PARA PREVIEW DE ARCHIVO */
.file-preview-container {
  margin-bottom: 1rem;
}

.file-preview {
  background: rgba(37, 37, 50, 0.8);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 15px;
  padding: 1rem;
  position: relative;
  display: flex;
  align-items: center;
  gap: 1rem;
}

.preview-content {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 1rem;
}

.preview-wrapper {
  display: flex;
  align-items: center;
  gap: 1rem;
  flex: 1;
}

.preview-image {
  width: 320px;
  height: 90px;
  max-width: 1000px;
  max-height: 900px;
  min-width: 120px;
  min-height: 90px;
  border-radius: 8px;
  object-fit: cover;
  border: 2px solid rgba(99, 102, 241, 0.3);
  flex-shrink: 0;
}

.preview-video {
  width: 350px;
  height: 90px;
  max-width: 1000px;
  max-height: 900px;
  min-width: 150px;
  min-height: 90px;
  border-radius: 8px;
  object-fit: cover;
  border: 2px solid rgba(99, 102, 241, 0.3);
  flex-shrink: 0;
}

.preview-info {
  display: flex;
  flex-direction: column;
  gap: 0.3rem;
  flex: 1;
}

.preview-type {
  font-weight: 600;
  color: #6366f1;
  font-size: 0.9rem;
}

.preview-size {
  font-size: 0.8rem;
  color: #a0a0b8;
}

.preview-audio {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  color: #6366f1;
}

.preview-audio-player {
  max-width: 200px;
}

.cancel-file-btn {
  position: absolute;
  top: 0.5rem;
  right: 0.5rem;
  background: rgba(239, 68, 68, 0.1);
  border: 1px solid rgba(239, 68, 68, 0.3);
  color: #ef4444;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.8rem;
  cursor: pointer;
  transition: all 0.3s ease;
}

.cancel-file-btn:hover {
  background: rgba(239, 68, 68, 0.2);
  transform: scale(1.1);
}

/* ESTILOS PARA INTERFAZ DE GRABACIÓN */
.recording-interface {
  background: linear-gradient(135deg, #ef4444, #dc2626);
  border-radius: 15px;
  padding: 1rem;
  margin-bottom: 1rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  animation: recordingPulse 2s ease-in-out infinite;
}

@keyframes recordingPulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.8; }
}

.recording-indicator {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  color: white;
  font-weight: 600;
}

.recording-dot {
  width: 12px;
  height: 12px;
  background: white;
  border-radius: 50%;
  animation: recordingBlink 1s ease-in-out infinite;
}

@keyframes recordingBlink {
  0%, 50% { opacity: 1; }
  51%, 100% { opacity: 0.3; }
}

.recording-controls {
  display: flex;
  gap: 0.5rem;
}

.cancel-recording-btn,
.stop-recording-btn {
  background: rgba(255, 255, 255, 0.2);
  border: 1px solid rgba(255, 255, 255, 0.3);
  color: white;
  padding: 0.5rem 1rem;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 600;
  font-size: 0.9rem;
  transition: all 0.3s ease;
}

.cancel-recording-btn:hover {
  background: rgba(255, 255, 255, 0.3);
}

.stop-recording-btn:hover {
  background: rgba(255, 255, 255, 0.3);
}

/* MENÚ MULTIMEDIA */
.media-menu-container {
  position: relative;
}

.media-btn {
  background: rgba(99, 102, 241, 0.1);
  border: 1px solid rgba(99, 102, 241, 0.3);
  color: #6366f1;
  padding: 0.7rem;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.3s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  font-size: 1.2rem;
}

.media-btn:hover:not(:disabled) {
  background: rgba(99, 102, 241, 0.2);
  transform: scale(1.05);
}

.media-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.media-menu {
  position: absolute;
  bottom: 50px;
  left: 0;
  background: rgba(26, 26, 36, 0.95);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 15px;
  padding: 0.5rem;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
  animation: menuSlideUp 0.2s ease;
  z-index: 100;
  min-width: 140px;
}

@keyframes menuSlideUp {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.media-option {
  background: transparent;
  border: none;
  color: #ffffff;
  padding: 0.8rem 1rem;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.3s ease;
  font-size: 0.9rem;
  font-weight: 500;
  text-align: left;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.media-option:hover {
  background: rgba(99, 102, 241, 0.1);
  color: #6366f1;
  transform: translateX(2px);
}

/* ESTILOS PARA MENSAJES MULTIMEDIA */
.message-image {
  max-width: 300px;
  max-height: 200px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.3s ease;
  object-fit: cover;
}

.message-image:hover {
  transform: scale(1.02);
  box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
}

.message-video {
  max-width: 350px;
  max-height: 250px;
  border-radius: 12px;
  object-fit: cover;
}

.message-audio {
  max-width: 250px;
}

.audio-player {
  display: flex;
  align-items: center;
  gap: 0.8rem;
  color: #6366f1;
}

.audio-icon {
  font-size: 1.2rem;
}

.audio-label {
  font-size: 0.9rem;
  color: #a0a0b8;
}

.image-caption,
.video-caption,
.audio-caption {
  margin-top: 0.8rem;
  font-size: 0.9rem;
  color: #e5e5e5;
  font-style: italic;
}

/* RESPONSIVE PARA MODAL */
@media (max-width: 768px) {
  .modal-content {
    width: 95%;
    margin: 1rem;
  }
  
  .modal-actions {
    flex-direction: column;
  }
  
  .modal-btn-cancel,
  .modal-btn-delete {
    width: 100%;
  }
  
  .file-preview {
    flex-direction: column;
    text-align: center;
  }
  
  .preview-content {
    flex-direction: column;
  }
  
  .media-menu {
    bottom: 60px;
  }
}
/* ESTILOS PARA PUBLICACIONES COMPARTIDAS EN CHAT */
.shared-post-message {
  max-width: 100%;
}

.share-message-text {
  margin-bottom: 0.8rem;
  font-style: italic;
  color: #e5e5e5;
}

.shared-post-card {
  background: rgba(15, 15, 20, 0.8);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 12px;
  overflow: hidden;
  max-width: 350px; /* Limitar ancho máximo */
  margin-top: 0.5rem;
}

.shared-post-header {
  padding: 0.8rem 1rem;
  display: flex;
  align-items: center;
  gap: 0.8rem;
  border-bottom: 1px solid rgba(255, 255, 255, 0.05);
}

.shared-post-author {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  flex: 1;
}

.shared-post-card .author-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: linear-gradient(135deg, #6366f1, #ec4899);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.8rem;
  font-weight: 600;
  color: white;
  overflow: hidden;
  flex-shrink: 0;
}

.shared-post-card .author-info {
  flex: 1;
  min-width: 0;
}

.shared-post-card .author-name {
  font-weight: 600;
  font-size: 0.9rem;
  color: #ffffff;
  display: flex;
  align-items: center;
  gap: 0.3rem;
  margin-bottom: 0.1rem;
}

.shared-post-card .author-username {
  font-size: 0.8rem;
  color: #a0a0b8;
}

.shared-post-card .post-date {
  font-size: 0.75rem;
  color: #a0a0b8;
  flex-shrink: 0;
}

.shared-post-content {
  padding: 0.8rem 1rem;
}

.shared-post-card .post-text {
  font-size: 0.9rem;
  line-height: 1.4;
  color: #ffffff;
  margin-bottom: 0.8rem;
  word-wrap: break-word;
}

.shared-post-card .post-media {
  margin-top: 0.8rem;
}

.shared-post-card .shared-post-image {
  width: 100%;
  max-height: 200px; /* Limitar altura de imágenes */
  object-fit: cover;
  border-radius: 8px;
  cursor: pointer;
  transition: transform 0.2s ease;
}

.shared-post-card .shared-post-image:hover {
  transform: scale(1.02);
}

.shared-post-card .shared-post-video {
  width: 100%;
  max-height: 200px; /* Limitar altura de videos */
  border-radius: 8px;
  object-fit: cover;
}

.shared-post-footer {
  padding: 0.6rem 1rem;
  border-top: 1px solid rgba(255, 255, 255, 0.05);
  background: rgba(0, 0, 0, 0.2);
}

.share-indicator {
  font-size: 0.75rem;
  color: #6366f1;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 0.3rem;
}

/* Verificación badge más pequeño en chat */
.shared-post-card .verified-badge {
  color: #6366f1;
  font-size: 0.8rem;
}

/* Responsive para móviles */
@media (max-width: 768px) {
  
  .shared-post-card .shared-post-image,
  .shared-post-card .shared-post-video {
    max-height: 150px;
  }
}

@keyframes bounce {
  0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
  40% { transform: translateY(-10px); }
  60% { transform: translateY(-5px); }
}
.shared-post-card.silenciada {
  opacity: 0.7;
  border: 1px dashed rgba(255, 255, 255, 0.3);
  background: rgba(37, 37, 50, 0.3);
}

.silenciado-indicator {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.5rem;
  background: rgba(239, 68, 68, 0.1);
  border-radius: 8px;
  margin-bottom: 0.5rem;
  font-size: 0.8rem;
  color: #ef4444;
}

.silenciado-icon {
  font-size: 1rem;
}

.silenciado-badge {
  margin-left: 0.5rem;
  font-size: 0.9rem;
}

.shared-post-card.silenciada .post-media-preview {
  filter: grayscale(0.3);
}

.shared-post-card.silenciada:hover {
  opacity: 0.9;
  transition: opacity 0.3s ease;
}

/* ESTILOS COMPLETOS DEL MODAL DE COMENTARIOS */
/* ============================================ */

/* Modal de Comentarios */
.comments-modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.8);
    backdrop-filter: blur(10px);
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    visibility: hidden;
    transition: all 0.3s ease;
}

.comments-modal.active {
    opacity: 1;
    visibility: visible;
        z-index: 9999999;
}

.comments-container {
    background: var(--dark-secondary);
    border-radius: 20px;
    width: 90%;
    max-width: 600px;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
    border: 1px solid rgba(255, 255, 255, 0.1);
    transform: scale(0.9);
    transition: transform 0.3s ease;
}

.comments-modal.active .comments-container {
    transform: scale(1);
}

.comments-header {
    padding: 0rem 1rem;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.comments-title {
    font-size: 1.3rem;
    font-weight: 700;
}

.close-comments {
    background: transparent;
    border: none;
    color: var(--text-secondary);
    font-size: 1.5rem;
    cursor: pointer;
    padding: 0.5rem;
    border-radius: 8px;
    transition: all 0.3s ease;
}

.close-comments:hover {
    background: rgba(255, 255, 255, 0.1);
    color: var(--text);
}

.comments-content {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
}

.comment-input-section {
    margin-bottom: 2rem;
}

.comment-input-wrapper {
    display: flex;
    gap: 1rem;
    align-items: flex-start;
}

.comment-user-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    flex-shrink: 0;
}

.comment-input-container {
    flex: 1;
}

.comment-input {
    width: 95%;
    background: rgba(37, 37, 50, 0.5);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    padding: 1rem;
    color: var(--text);
    font-size: 1rem;
    resize: none;
    min-height: 80px;
    font-family: inherit;
    transition: all 0.3s ease;
}

.comment-input:focus {
    outline: none;
    border-color: var(--primary);

/* MODAL DE COMPARTIR */
.share-modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.8);
    backdrop-filter: blur(10px);
    z-index: 9998;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    visibility: hidden;
    transition: all 0.3s ease;
    z-index: 9999999;
}

.share-modal.active {
    opacity: 1;
    visibility: visible;
}

.share-container {
    background: var(--dark-secondary);
    border-radius: 20px;
    width: 90%;
    max-width: 500px;
    max-height: 70vh;
    display: flex;
    flex-direction: column;
    border: 1px solid rgba(255, 255, 255, 0.1);
    transform: scale(0.9);
    transition: transform 0.3s ease;
}

.share-modal.active .share-container {
    transform: scale(1);
}

.share-header {
    padding: 1.5rem;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.share-title {
    font-size: 1.3rem;
    font-weight: 700;
}

.close-share {
    background: transparent;
    border: none;
    color: var(--text-secondary);
    font-size: 1.5rem;
    cursor: pointer;
    padding: 0.5rem;
    border-radius: 8px;
    transition: all 0.3s ease;
}

.close-share:hover {
    background: rgba(255, 255, 255, 0.1);
    color: var(--text);
}

.share-content {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
}

.share-search {
    width: 100%;
    background: rgba(37, 37, 50, 0.5);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    padding: 1rem;
    color: var(--text);
    font-size: 1rem;
    margin-bottom: 1.5rem;
    font-family: inherit;
    transition: all 0.3s ease;
}

.share-search:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 10px rgba(99, 102, 241, 0.2);
}

.share-search::placeholder {
    color: var(--text-secondary);
}

.mutual-followers-list {

}

.mutual-follower:hover {
    background: rgba(99, 102, 241, 0.1);
    border-color: rgba(99, 102, 241, 0.3);
    transform: translateY(-2px);
}

.mutual-follower.selected {
    background: rgba(99, 102, 241, 0.2);

}

.follower-avatar {

    flex-shrink: 0;
}

}

.share-actions {

    gap: 1rem;
}

.share-btn {
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: white;
    border: none;
    padding: 0.8rem 2rem;
    border-radius: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    flex: 1;
    font-size: 1rem;
}

.share-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(99, 102, 241, 0.3);
}

.share-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
}

.empty-followers {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--text-secondary);
}

.empty-followers-icon {
    font-size: 3rem;
    margin-bottom: 1rem;
}

/* Estados avanzados del botón compartir */
.share-btn {
    opacity: 0;
    visibility: hidden;
    transform: scale(0.9);
    transition: all 0.3s ease;
}

.share-btn:not(:disabled) {
    opacity: 1;
    visibility: visible;
    transform: scale(1);
}

.share-actions:has(.share-btn:disabled) {
    opacity: 0;
    visibility: hidden;
    transform: translateY(10px);
    transition: all 0.3s ease;
    pointer-events: none;
}

.share-actions:has(.share-btn:not(:disabled)) {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
    pointer-events: auto;
}

/* ESTILOS PARA BOTÓN DE COMPRA EN POST COMPARTIDO */
/* ============================================ */

.chat-buy-button {
    background: linear-gradient(135deg, var(--warning), #f59e0b);
    color: white;
    border: none;
    padding: 0.4rem 0.8rem;
    border-radius: 20px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer !important;
    transition: all 0.3s ease;
    user-select: none !important;
    -webkit-user-select: none !important;
    -moz-user-select: none !important;
    -ms-user-select: none !important;
    -webkit-touch-callout: none !important;
    -webkit-tap-highlight-color: transparent !important;
    outline: none !important;
    transform: translateY(0);
    box-shadow: none;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    width: 100%;
    justify-content: center;
    margin-top: 0.5rem;
}

.chat-buy-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4);
}

.chat-buy-button:active {
    transform: translateY(0);
    box-shadow: 0 2px 8px rgba(245, 158, 11, 0.3);
}

.chat-buy-button .buy-icon {
    font-size: 1rem;
}

.chat-buy-button .buy-text {
    font-size: 0.8rem;
    font-weight: 600;
}

/* Asegurar que el botón sea clickeable en todos los dispositivos */
.chat-buy-button:focus {
    outline: none !important;
}

/* Ripple effect al hacer click */
.chat-buy-button::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.3);
    transform: translate(-50%, -50%);
    transition: width 0.6s, height 0.6s;
}

.chat-buy-button:active::after {
    width: 300px;
    height: 300px;
}

/* Responsive para móviles */
@media (max-width: 768px) {
    .chat-buy-button {
        padding: 0.5rem 1rem;
        font-size: 0.85rem;
    }
}

const formatearTiempoRelativo = (fechaStr) => {
  try {
    if (!fechaStr) return '';
    
    // Si es "ahora", devolver directamente
    if (fechaStr === 'ahora' || fechaStr === 'now') {
      return 'ahora';
    }
    
    // Parsear fecha - IMPORTANTE: asegurarse que esté en formato ISO
    let fecha;
    
    // Si la fecha viene en formato SQL (YYYY-MM-DD HH:MM:SS)
    if (fechaStr.includes(' ')) {
      fecha = new Date(fechaStr.replace(' ', 'T') + 'Z'); // Añadir Z para UTC
    } else {
      fecha = new Date(fechaStr);
    }
    
    // Verificar si la fecha es válida
    if (isNaN(fecha.getTime())) {
      console.warn('Fecha inválida:', fechaStr);
      return fechaStr;
    }
    
    const ahora = new Date();
    const diffMs = Math.abs(ahora - fecha); // ✅ USAR Math.abs() para evitar negativos
    const diffSeconds = Math.floor(diffMs / 1000);
    const diffMinutes = Math.floor(diffSeconds / 60);
    const diffHours = Math.floor(diffMinutes / 60);
    const diffDays = Math.floor(diffHours / 24);
    const diffWeeks = Math.floor(diffDays / 7);
    const diffMonths = Math.floor(diffDays / 30);
    const diffYears = Math.floor(diffDays / 365);
    
    // ✅ AGREGAR VALIDACIÓN: si la diferencia es muy pequeña
    if (diffSeconds < 5) return 'ahora';
    if (diffSeconds < 60) return `${diffSeconds}seg`;
    if (diffMinutes < 60) return `${diffMinutes}min`;
    if (diffHours < 24) return `${diffHours}h`;
    if (diffDays < 7) return `${diffDays}d`;
    if (diffWeeks < 4) return `${diffWeeks}sem`;
    if (diffMonths < 12) return `${diffMonths}mes`;
    return `${diffYears}a`;
    
  } catch (error) {
    console.error('Error formateando fecha:', error, fechaStr);
    return fechaStr;
  }
};

        class FullscreenMessageViewer {
    constructor() {
        this.messages = [];
        this.currentIndex = 0;
        this.isVisible = false;
        this.currentVideo = null;
        this.controlsTimeout = null;
        this.currentUser = null;
        this.chatInfo = null;
        
        this.init();
    }

    init() {
        this.bindEvents();
    }

    bindEvents() {
        document.getElementById('closeBtn').addEventListener('click', () => this.close());
        document.getElementById('prevBtn').addEventListener('click', () => this.previousMessage());
        
        document.addEventListener('keydown', (e) => {
            if (!this.isVisible) return;
            
            switch(e.key) {
                case 'Escape':
                    this.close();
                    break;
                case 'ArrowLeft':
                    this.previousMessage();
                    break;
                case 'ArrowRight':
                    this.nextMessage();
                    break;
                case ' ':
                    if (this.currentVideo) {
                        e.preventDefault();
                        this.toggleVideoPlayback();
                    }
                    break;
            }
        });

        document.getElementById('contentArea').addEventListener('click', (e) => {
            if (e.target === document.getElementById('contentArea')) {
                this.close();
            }
        });
    }

    open(messages, startIndex = 0, currentUser = null, chatInfo = null) {
        this.messages = messages;
        this.currentIndex = startIndex;
        this.isVisible = true;
        this.currentUser = currentUser;
        this.chatInfo = chatInfo;

        document.getElementById('fullscreenViewer').classList.add('active');
        document.body.style.overflow = 'hidden';

        this.updateMessageCounter();
        this.renderCurrentMessage();
    }

    close() {
        this.isVisible = false;
        document.getElementById('fullscreenViewer').classList.remove('active');
        document.body.style.overflow = '';
        
        if (this.currentVideo) {
            this.currentVideo.pause();
            this.currentVideo = null;
        }
    }

    nextMessage() {
        if (this.currentIndex < this.messages.length - 1) {
            this.currentIndex++;
            this.updateMessageCounter();
            this.renderCurrentMessage();
        }
    }

    previousMessage() {
        if (this.currentIndex > 0) {
            this.currentIndex--;
            this.updateMessageCounter();
            this.renderCurrentMessage();
        }
    }

    updateMessageCounter() {
        document.getElementById('currentMessageNumber').textContent = this.currentIndex + 1;
        document.getElementById('totalMessages').textContent = this.messages.length;
    }

    renderCurrentMessage() {
        const message = this.messages[this.currentIndex];
        const container = document.getElementById('messageContainer');

        container.innerHTML = '';

        switch (message.tipo_mensaje) {
            case 'video':
                this.renderVideoMessage(message, container);
                break;
            case 'imagen':
                this.renderImageMessage(message, container);
                break;
            case 'audio':
                this.renderAudioMessage(message, container);
                break;
            default:
                this.renderTextMessage(message, container);
                break;
        }

        this.updateMessageInfo(message);
    }

    renderVideoMessage(message, container) {
        container.innerHTML = `
            <div class="post-content">
                <video 
                    class="post-video" 
                    id="currentVideo"
                    src="${message.archivo_url}"
                    preload="metadata"
                    controls
                ></video>
                
                <div class="custom-video-controls" id="videoControls">
                    <button class="video-control-btn" id="playPauseBtn">⏸️</button>
                    <div class="progress-container" id="progressContainer">
                        <div class="progress-bar">
                            <div class="progress-filled" id="progressFilled"></div>
                        </div>
                    </div>
                    <div class="time-display" id="timeDisplay">0:00 / 0:00</div>
                    <button class="video-control-btn" id="volumeBtn">🔊</button>
                </div>
            </div>
        `;

        this.setupVideoControls();
    }

    renderImageMessage(message, container) {
        container.innerHTML = `
            <div class="post-content">
                <img class="post-image" src="${message.archivo_url}" alt="Imagen del mensaje">
            </div>
        `;
    }

    setupVideoControls() {

        const playPauseBtn = document.getElementById('playPauseBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressFilled = document.getElementById('progressFilled');
        const timeDisplay = document.getElementById('timeDisplay');
        const volumeBtn = document.getElementById('volumeBtn');

        this.currentVideo = video;

        video.addEventListener('loadedmetadata', () => {
            video.play();
        });

        video.addEventListener('play', () => {
            playPauseBtn.textContent = '⏸️';
            this.hideVideoControls();
        });

        video.addEventListener('pause', () => {
            playPauseBtn.textContent = '▶️';
            this.showVideoControls();
        });

        video.addEventListener('timeupdate', () => {
            if (video.duration) {
                const progress = (video.currentTime / video.duration) * 100;
                progressFilled.style.width = progress + '%';
                
                const currentTime = this.formatTime(video.currentTime);
                const totalTime = this.formatTime(video.duration);
                timeDisplay.textContent = `${currentTime} / ${totalTime}`;
            }
        });

        playPauseBtn.addEventListener('click', () => {
            this.toggleVideoPlayback();
        });

        video.addEventListener('click', () => {
            this.toggleVideoPlayback();
        });

        progressContainer.addEventListener('click', (e) => {
            const rect = progressContainer.getBoundingClientRect();
            const pos = (e.clientX - rect.left) / rect.width;
            video.currentTime = pos * video.duration;
        });

        if (volumeBtn) {
            volumeBtn.addEventListener('click', () => {
                video.muted = !video.muted;
                volumeBtn.textContent = video.muted ? '🔇' : '🔊';
            });
        }
    }

    toggleVideoPlayback() {
        if (this.currentVideo) {
            if (this.currentVideo.paused) {
                this.currentVideo.play();
            } else {
                this.currentVideo.pause();
            }
        }
    }

    showVideoControls() {
        const controls = document.getElementById('videoControls');
        if (controls) {
            controls.classList.add('visible');
            
            if (this.currentVideo && !this.currentVideo.paused) {
                this.controlsTimeout = setTimeout(() => {
                    this.hideVideoControls();
                }, 4000);
            }
        }
    }

    hideVideoControls() {
        const controls = document.getElementById('videoControls');
        if (controls && this.currentVideo && !this.currentVideo.paused) {
            controls.classList.remove('visible');
        }
        
        if (this.controlsTimeout) {
            clearTimeout(this.controlsTimeout);
            this.controlsTimeout = null;
        }
    }

    formatTime(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins}:${secs.toString().padStart(2, '0')}`;
    }

    updateMessageInfo(message) {

                <div class="media-description fade-in">

            ` : ''}
        `;
    }

    getMessageTypeLabel(tipo) {
        const labels = {
            'imagen': '📷 Imagen',
            'video': '🎥 Video', 
            'audio': '🎵 Audio',
            'texto': '💬 Texto'
        };
        return labels[tipo] || '📄 Mensaje';
    }

    getDefaultMessageText(tipo) {
        const defaults = {
            'imagen': '📷 Imagen',
            'video': '🎥 Video',
            'audio': '🎵 Mensaje de voz',
            'texto': ''
        };
        return defaults[tipo] || '';
    }

    escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    generateInitials(name) {
        if (!name) return 'U';
        const words = name.trim().split(' ');
        if (words.length >= 2) {
            return (words[0][0] + words[1][0]).toUpperCase();
        }
        return (words[0][0] + (words[0][1] || '')).toUpperCase();
    }
}

          // Iniciar grabación de audio
          const startAudioRecording = async () => {
            try {
              const stream = await navigator.mediaDevices.getUserMedia({ 
                audio: {
                  echoCancellation: true,
                  noiseSuppression: true,
                  sampleRate: 44100
                }
              });
              
              const mediaRecorder = new MediaRecorder(stream, {
                mimeType: 'audio/webm;codecs=opus'
              });
              
              const audioChunks = [];
              
              mediaRecorder.ondataavailable = (event) => {
                audioChunks.push(event.data);
              };
              
              mediaRecorder.onstop = () => {
                const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                const audioFile = new File([audioBlob], `audio_${Date.now()}.webm`, { type: 'audio/webm' });
                setSelectedFile({ archivo: audioFile, tipo: 'audio' });
                
                // Crear URL para preview
                const audioUrl = URL.createObjectURL(audioBlob);
                setPreviewUrl(audioUrl);
                
                // Limpiar stream
                stream.getTracks().forEach(track => track.stop());
              };
              
              mediaRecorder.start(250); // Grabar en chunks de 250ms
              setAudioRecorder(mediaRecorder);
              setIsRecordingAudio(true);
              setRecordingTime(0);
              setShowMediaMenu(false);
              
              // Contador de tiempo
              const interval = setInterval(() => {
                setRecordingTime(prev => {
                  if (prev >= 60) { // Máximo 1 minuto
                    stopAudioRecording();
                    return 60;
                  }
                  return prev + 1;
                });
              }, 1000);
              
              // Guardar referencia al intervalo
              mediaRecorder.timeInterval = interval;
              
            } catch (error) {
              console.error('Error iniciando grabación:', error);
              setError('No se pudo acceder al micrófono');
            }
          };

          // Detener grabación de audio
          const stopAudioRecording = () => {
            if (audioRecorder && isRecordingAudio) {
              clearInterval(audioRecorder.timeInterval);
              audioRecorder.stop();
              setAudioRecorder(null);
              setIsRecordingAudio(false);
              setRecordingTime(0);
            }
          };

          // Cancelar grabación
          const cancelAudioRecording = () => {
            if (audioRecorder && isRecordingAudio) {

const cargarMensajes = async (chatId, mensajeAnclaId = null) => {
  try {
    const data = await apiCall('obtener_mensajes', {
      method: 'POST',
      body: { 
        usuario_id: chatId,
        mensaje_ancla_id: mensajeAnclaId,
        limit_antes: 20,
        limit_despues: 20
      }
    });
    
    // Detectar si hay mensaje pendiente de aprobación RECIBIDO
    const mensajesPendientesRecibidos = data.mensajes?.filter(msg => 
      msg.estado === 'pendiente_aprobacion' && msg.sender === 'other'
    ) || [];
    
    if (mensajesPendientesRecibidos.length > 0) {
      setHasPendingRequest(true);
      setPendingRequestData(mensajesPendientesRecibidos[0]);
    } else {
      setHasPendingRequest(false);
      setPendingRequestData(null);
    }
    
    setMessages(prev => ({
      ...prev,
      [chatId]: data.mensajes || []
    }));
    
    if (data.chat_info) {
      setChats(prev => {
        const chatExistente = prev.find(chat => chat.id === chatId);
        
        if (chatExistente) {
          return prev.map(chat => 
            chat.id === chatId 
              ? {
                  ...chat,
                  name: data.chat_info.name,
                  username: data.chat_info.username,
                  avatar: data.chat_info.avatar,
                  isOnline: data.chat_info.isOnline,
                  verified: data.chat_info.verified,
                  canWrite: data.chat_info.canWrite,
                  status: data.chat_info.chatStatus === 'active' ? 'active' : data.chat_info.chatStatus,
                  lastReadMessageId: data.chat_info.lastReadMessageId,
                  solicitud_mensaje_recibida: data.chat_info.solicitud_mensaje_recibida || false,
                  solicitud_mensaje_enviada: data.chat_info.solicitud_mensaje_enviada || false,
                  hay_chat_existente: data.chat_info.hay_chat_existente || false // ✅ NUEVO
                }
              : chat
          );
        } else {
          const nuevoChat = {
            id: chatId,
            name: data.chat_info.name,
            username: data.chat_info.username,
            avatar: data.chat_info.avatar,
            lastMessage: data.mensajes?.length > 0 
              ? data.mensajes[data.mensajes.length - 1].text 
              : 'Sin mensajes',
            timestamp: 'ahora',
            unreadCount: 0,
            isOnline: data.chat_info.isOnline,
            verified: data.chat_info.verified,
            canWrite: data.chat_info.canWrite,
            status: data.chat_info.chatStatus === 'active' ? 'active' : data.chat_info.chatStatus,
            isMutualFollower: data.chat_info.chatStatus === 'active',
            lastReadMessageId: data.chat_info.lastReadMessageId,
            solicitud_mensaje_recibida: data.chat_info.solicitud_mensaje_recibida || false,
            solicitud_mensaje_enviada: data.chat_info.solicitud_mensaje_enviada || false,
            hay_chat_existente: data.chat_info.hay_chat_existente || false // ✅ NUEVO
          };
          
          return [nuevoChat, ...prev];
        }
      });
    }
    
    return {
      mensajes: data.mensajes || [],
      mensajeAnclaId: data.mensaje_ancla_id,
      lastReadMessageId: data.chat_info.lastReadMessageId
    };
  } catch (error) {
    console.error('Error cargando mensajes:', error);
    setError('Error al cargar mensajes');
    return { mensajes: [], mensajeAnclaId: null, lastReadMessageId: null };
  }
};

const enviarMensaje = async () => {
  // Si hay archivo multimedia, usar función especializada
  if (selectedFile) {
    await enviarArchivoMultimedia();
    setTimeout(forceScrollToBottom, 300);
    return;
  }

  if (!message.trim() || !activeChat || isSending) return;

  // Verificar si el chat permite escritura
  const chatActual = getCurrentChatInfo();
  
  // ✅ CORRECCIÓN: Solo mostrar modal de solicitud si el estado es 'none'
  // Si hay_chat_existente es true, NO pedir solicitud
  if (chatActual?.status === 'none' && !chatActual?.hay_chat_existente) {
    setPendingMessageToSend(message.trim());
    setShowRequestConfirm(true);
    return;
  }

  // Si hay solicitud pendiente recibida, bloquear
  if (hasPendingRequest) {
    showWarning('Debes aceptar o rechazar la solicitud primero');
    return;
  }
  
  // Si ya tiene solicitud enviada, bloquear
  if (chatActual?.status === 'pending_sent') {
    showWarning('Ya enviaste una solicitud. Espera a que la acepten.');
    return;
  }

  const mensajeTexto = message.trim();
  setMessage('');
  setIsSending(true);

  try {
    const response = await apiCall('enviar_mensaje', {
      method: 'POST',
      body: {
        receptor_id: activeChat,
        contenido: mensajeTexto,
        tipo_mensaje: 'texto'
      }
    });

    if (response.success) {
      // ✅ Verificar si es solicitud
      if (response.tipo_envio === 'solicitud') {
        // Actualizar estado local
        setChats(prev => prev.map(chat => 
          chat.id === activeChat 
            ? {
                ...chat,
                status: 'pending_sent',
                canWrite: false,
                solicitud_pendiente: true,
                lastMessage: 'Solicitud enviada',
                timestamp: 'ahora'
              }
            : chat
        ));
        
        setMessage('');
        showSuccess('Solicitud enviada. Espera a que la acepten.');
        
      } else {
        // Mensaje normal - recargar mensajes
        await cargarMensajes(activeChat);
        await actualizarListaChats();
        setTimeout(forceScrollToBottom, 200);
      }
    }
    
  } catch (error) {
    console.error('Error enviando mensaje:', error);
    showError('Error al enviar mensaje');
    setMessage(mensajeTexto);
  } finally {
    setIsSending(false);
  }
};

// NUEVO useEffect #1: Intersection Observer para marcar mensajes como leídos
useEffect(() => {
  if (!activeChat || !messagesEndRef.current) return;
  
  const messagesContainer = messagesEndRef.current.parentElement;
  if (!messagesContainer) return;
  
  if (observerRef.current) {
    observerRef.current.disconnect();
  }
  
  observerRef.current = new IntersectionObserver(
    (entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const mensajeId = parseInt(entry.target.getAttribute('data-message-id'));
          const mensajeSender = entry.target.getAttribute('data-message-sender');
          
          if (mensajeId && mensajeSender === 'other') {
            marcarMensajeComoVisto(mensajeId);
          }
        }
      });
    },
    {
      root: messagesContainer,
      threshold: 0.5,
      rootMargin: '0px'
    }
  );
  
   const mensajeElements = messagesContainer.querySelectorAll('[data-message-id]');
  mensajeElements.forEach(element => {
    observerRef.current.observe(element);
  });
  
  return () => {
    if (observerRef.current) {
      observerRef.current.disconnect();
    }
  };
}, [activeChat, currentMessages, marcarMensajeComoVisto]);

  const messagesContainer = messagesEndRef.current?.parentElement;
  if (!messagesContainer) return;
  
  const handleScrollIndicator = () => {
    const { scrollHeight, scrollTop, clientHeight } = messagesContainer;
    const isAtBottom = scrollHeight - scrollTop - clientHeight <= 50;
    setHasUnreadBelow(!isAtBottom);
  };
  
  messagesContainer.addEventListener('scroll', handleScrollIndicator);
  return () => messagesContainer.removeEventListener('scroll', handleScrollIndicator);
}, []);

// AGREGAR este useLayoutEffect DESPUÉS de los otros useEffect
useLayoutEffect(() => {
  // Solo ejecutar si la bandera está activa
  if (!shouldScrollToLastRead || !activeChat || !messagesEndRef.current) return;
  
  const chatActual = chats.find(chat => chat.id === activeChat);
  const lastReadMessageId = chatActual?.lastReadMessageId;
  
  if (lastReadMessageId) {
    const lastReadElement = document.querySelector(`[data-message-id="${lastReadMessageId}"]`);
    
    if (lastReadElement) {
      lastReadElement.scrollIntoView({ 
        behavior: 'instant',
        block: 'center'
      });
      
      lastReadElement.classList.add('last-read-highlight');
      setTimeout(() => {
        lastReadElement.classList.remove('last-read-highlight');
      }, 2000);
    }
  } else {
    const container = messagesEndRef.current.parentElement;
    if (container) {
      container.scrollTop = container.scrollHeight;
    }
  }
  
  // DESACTIVAR la bandera después de ejecutar
  setShouldScrollToLastRead(false);
  
}, [shouldScrollToLastRead, activeChat, messages]); // Depende de la bandera

             {msg.tipo_mensaje === 'publicacion_compartida' && msg.publicacion_compartida && (() => {

if (pub.acceso_bloqueado) {

<script>
if (typeof RepliesCollapseSystem === 'undefined') {
    console.log('⚠️ Cargando RepliesCollapseSystem completo...');
    
    class RepliesCollapseSystem {
        constructor() {
            this.collapsedReplies = new Set();
            this.init();
        }

        init() {
            this.setupEventListeners();
            this.injectStyles();
            console.log('📂 Sistema de colapso de respuestas inicializado');
        }

        setupEventListeners() {
            document.addEventListener('click', (e) => {
                if (e.target.closest('.toggle-replies-btn')) {
                    e.preventDefault();
                    e.stopPropagation();
                    this.toggleReplies(e.target.closest('.toggle-replies-btn'));
                }
            });
        }

        refreshComments() {
            this.processComments();
        }

        processComments() {
            const mainComments = document.querySelectorAll('.comment-item:not(.reply)');
            mainComments.forEach(comment => {
                this.processComment(comment);
            });
        }

        processComment(commentElement) {
            const commentId = commentElement.dataset.commentId;
            if (!commentId) return;

            const replies = commentElement.querySelectorAll('.comment-item.reply');
            
            if (replies.length === 0) return;

            // Verificar si ya tiene el botón
            if (commentElement.querySelector('.toggle-replies-btn')) return;

            // Por defecto, TODAS las respuestas están colapsadas
            this.collapsedReplies.add(commentId);

            // Crear el botón
            const toggleButton = this.createToggleButton(commentId, replies.length);
            
            // Insertar el botón después de las acciones del comentario
            const actionsBar = commentElement.querySelector('.comment-actions-bar');
            if (actionsBar) {
                actionsBar.appendChild(toggleButton);
            }

            // Crear contenedor para las respuestas
            this.wrapReplies(commentElement, commentId);

            // Aplicar el estado inicial (colapsado)
            this.updateRepliesVisibility(commentId);
            this.updateToggleButton(toggleButton, commentId);
        }

        createToggleButton(commentId, repliesCount) {
            const button = document.createElement('button');
            button.className = 'comment-action toggle-replies-btn collapsed';
            button.dataset.commentId = commentId;
            button.dataset.repliesCount = repliesCount;
            
            const text = repliesCount === 1 ? 'respuesta' : 'respuestas';
            button.innerHTML = `<span class="replies-text">Ver ${repliesCount} ${text}</span>`;
            
            return button;
        }

       wrapReplies(commentElement, commentId) {
    const replies = commentElement.querySelectorAll('.comment-item.reply');
    
    if (replies.length === 0) return;

    const repliesContainer = document.createElement('div');
    repliesContainer.className = 'replies-container collapsed';
    repliesContainer.dataset.commentId = commentId;

    replies.forEach(reply => {
        repliesContainer.appendChild(reply);
    });

    const mainComment = commentElement.querySelector('.comment-main');
    const replyForm = commentElement.querySelector('.reply-form');
    
    commentElement.appendChild(repliesContainer);
}

        toggleReplies(button) {
            const commentId = button.dataset.commentId;
            
            if (this.collapsedReplies.has(commentId)) {
                this.collapsedReplies.delete(commentId);
                console.log(`📂 Expandiendo respuestas del comentario ${commentId}`);
            } else {
                this.collapsedReplies.add(commentId);
                console.log(`📁 Colapsando respuestas del comentario ${commentId}`);
            }

            this.updateRepliesVisibility(commentId);
            this.updateToggleButton(button, commentId);
        }

        updateRepliesVisibility(commentId) {
            const repliesContainer = document.querySelector(`.replies-container[data-comment-id="${commentId}"]`);
            if (!repliesContainer) return;

            const isCollapsed = this.collapsedReplies.has(commentId);
            
            if (isCollapsed) {
                repliesContainer.classList.add('collapsed');
            } else {
                repliesContainer.classList.remove('collapsed');
            }
        }

        updateToggleButton(button, commentId) {
            const isCollapsed = this.collapsedReplies.has(commentId);
            const repliesText = button.querySelector('.replies-text');
            const repliesCount = parseInt(button.dataset.repliesCount);
            const text = repliesCount === 1 ? 'respuesta' : 'respuestas';
            
            if (isCollapsed) {
                button.classList.add('collapsed');
                repliesText.textContent = `Ver ${repliesCount} ${text}`;
            } else {
                button.classList.remove('collapsed');
                repliesText.textContent = `Ocultar ${repliesCount} ${text}`;
            }
        }

        injectStyles() {
            if (document.getElementById('replies-collapse-styles')) return;
            
            const styles = document.createElement('style');
            styles.id = 'replies-collapse-styles';
            styles.textContent = `
                .toggle-replies-btn {
                    background: transparent;
                    border: none;
                    cursor: pointer;
                    transition: all 0.3s ease;
                    display: flex;
                    align-items: center;
                    gap: 0.4rem;
                    padding: 0.4rem 0.8rem;
                    border-radius: 6px;
                    font-size: 0.85rem;
                    outline: none;
                    margin-left: 1rem;
                }

                .replies-container {
                    overflow: hidden;
                    transition: all 0.4s ease;
                    max-height: none;
                    opacity: 1;
                }

                .replies-container.collapsed {
                    max-height: 0;
                    opacity: 0;
                    margin: 0;
                    padding: 0;
                }

                .replies-container .comment-item.reply {
                    border-left: 2px solid rgba(168, 85, 247, 0.2);
                    margin-left: 0.5rem;
                    padding-left: 1rem;
                }
            `;
            
            document.head.appendChild(styles);
        }
    }
    
    window.repliesCollapseSystem = new RepliesCollapseSystem();
}

// ================================================
// SISTEMA DE NOTIFICACIONES TOAST
// ================================================
window.showToast = function(message, type = 'info', duration = 3000) {
  // Crear contenedor si no existe
  let container = document.getElementById('toast-container');
  if (!container) {
    container = document.createElement('div');
    container.id = 'toast-container';
    container.className = 'toast-container';
    document.body.appendChild(container);
  }
  
  // Iconos según tipo
  const icons = {
    success: '✅',
    error: '❌',
    warning: '⚠️',
    info: 'ℹ️'
  };
  
  // Títulos según tipo
  const titles = {
    success: 'Éxito',
    error: 'Error',
    warning: 'Advertencia',
    info: 'Información'
  };
  
  // Crear toast
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.innerHTML = `
    <div class="toast-icon">${icons[type] || icons.info}</div>
    <div class="toast-content">
      <div class="toast-title">${titles[type]}</div>
      <div class="toast-message">${message}</div>
    </div>
    <button class="toast-close" onclick="this.parentElement.remove()">×</button>
    <div class="toast-progress"></div>
  `;
  
  container.appendChild(toast);
  
  // Auto-cerrar después de la duración especificada
  setTimeout(() => {
    toast.classList.add('fade-out');
    setTimeout(() => {
      if (toast.parentElement) {
        toast.remove();
      }
    }, 400);
  }, duration);
};

// Función auxiliar para mensajes de error
window.showError = function(message) {
  window.showToast(message, 'error', 3000);
};

// Función auxiliar para mensajes de éxito
window.showSuccess = function(message) {
  window.showToast(message, 'success', 3000);
};

// Función auxiliar para advertencias
window.showWarning = function(message) {
  window.showToast(message, 'warning', 3000);
};

// Función auxiliar para información
window.showInfo = function(message) {
  window.showToast(message, 'info', 3000);
};

</script>

// SISTEMA DE AUTO-LIMPIEZA DE ARCHIVOS (JAVASCRIPT)
// ================================================
(function() {
    const INTERVALO_LIMPIEZA = 30 * 60 * 1000; // 30 minutos
    
    async function ejecutarLimpiezaAutomatica() {
        try {
            const response = await fetch('/php/limpiar_archivos_chat.php', {
                method: 'GET',
                credentials: 'include'
            });
            
            if (!response.ok) {
                return;
            }
            
            const data = await response.json();
            
            if (data.success && data.eliminados > 0) {
                console.log(`🧹 Limpieza automática: ${data.eliminados} archivo(s) eliminado(s)`);
            }
            
        } catch (error) {
            console.debug('Limpieza automática omitida:', error.message);
        }
    }
    
    // Ejecutar 5 segundos después de cargar
    setTimeout(ejecutarLimpiezaAutomatica, 5000);
    
    // Ejecutar cada 30 minutos
    setInterval(ejecutarLimpiezaAutomatica, INTERVALO_LIMPIEZA);
    
    console.log('✅ Sistema de auto-limpieza activado');
})();
</script>
