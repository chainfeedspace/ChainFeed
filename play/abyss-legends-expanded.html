<!-- Migrador de instancias — debe ir ANTES de React -->
<script>
(function() {
  const raw = localStorage.getItem('abyssLegendsCollection');
  if (!raw) return;

  const col = JSON.parse(raw);
  const instancesMap = JSON.parse(localStorage.getItem('abyssCardInstances') || '{}');
  let changed = false;

  Object.entries(col).forEach(([cardId, data]) => {
    const count = data.count || 0;
    if (count === 0) return;

    const existing = instancesMap[cardId];
    if (existing?.length === count) return;

    const instances = [];
    for (let i = 0; i < count; i++) {
      if (existing?.[i]) { instances.push(existing[i]); continue; }
      let atkBonus = 0, hpBonus = 0, upgCount = 0;
      if (i === 0 && !existing?.length) {
        const saved = localStorage.getItem('abyssCardUpgrades_' + cardId);
        if (saved) {
          const upgs = JSON.parse(saved);
          atkBonus = upgs.atkBonus || 0;
          hpBonus  = upgs.hpBonus  || 0;
          upgCount = upgs.upgCount || 0;
        }
      }
      instances.push({
        iid: cardId + '_' + i + '_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
        atkBonus, hpBonus, upgCount,
      });
    }
    instancesMap[cardId] = instances;
    changed = true;
  });

  if (changed) {
    localStorage.setItem('abyssCardInstances', JSON.stringify(instancesMap));
    console.log('✅ Instancias guardadas en abyssCardInstances');
  }
})();
</script>
<!-- React & Babel -->
