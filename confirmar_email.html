<!DOCTYPE html>
<html lang='es'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Confirmar Email - ChainFeed</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 48px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        .icon {
            font-size: 72px;
            margin-bottom: 24px;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 16px;
        }
        .success h1 { color: #10b981; }
        .error h1 { color: #ef4444; }
        p {
            color: #475569;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .btn {
            display: inline-block;
            padding: 14px 32px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            transition: transform 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Estado de éxito -->
        <div id="success-state" class="hidden">
            <div class='icon'>✅</div>
            <h1 id="success-title">¡Email Actualizado!</h1>
            <p id="success-message">Tu dirección de email ha sido cambiada exitosamente.</p>
            <p style="margin-top: 20px; color: #64748b;">Redirigiendo a tu perfil en 5 segundos...</p>
            <a href='/perfil.html' class='btn'>Ir a mi Perfil</a>
        </div>

        <!-- Estado de error -->
        <div id="error-state" class="hidden">
            <div class='icon'>❌</div>
            <h1 id="error-title">Error</h1>
            <p id="error-message">Ha ocurrido un error al procesar tu solicitud.</p>
            <a href='/perfil.html' class='btn'>Ir a mi Perfil</a>
        </div>

        <!-- Estado de carga -->
        <div id="loading-state">
            <div class='icon'>⏳</div>
            <h1>Procesando...</h1>
            <p>Estamos confirmando tu cambio de email.</p>
        </div>
    </div>

    <script>
        // Obtener parámetros de la URL
        const urlParams = new URLSearchParams(window.location.search);
        const status = urlParams.get('status');
        const title = urlParams.get('title');
        const message = urlParams.get('message');

        // Mostrar el estado correspondiente
        setTimeout(() => {
            const loadingState = document.getElementById('loading-state');
            const successState = document.getElementById('success-state');
            const errorState = document.getElementById('error-state');

            loadingState.classList.add('hidden');

            if (status === 'success') {
                document.getElementById('success-title').textContent = title || '¡Email Actualizado!';
                document.getElementById('success-message').textContent = message || 'Tu dirección de email ha sido cambiada exitosamente.';
                successState.classList.remove('hidden');
                
                // Redirigir después de 5 segundos
                setTimeout(() => {
                    window.location.href = '/perfil.html';
                }, 5000);
            } else {
                document.getElementById('error-title').textContent = title || 'Error';
                document.getElementById('error-message').textContent = message || 'Ha ocurrido un error al procesar tu solicitud.';
                errorState.classList.remove('hidden');
            }
        }, 1000);
    </script>
    
        <script src="/js/block-check.js"></script>

</body>
</html>
