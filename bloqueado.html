<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
        <meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

    <title>Test Inline Script</title>
    
<link rel="icon" type="image/png" sizes="192x192" href="/icons/logo192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icons/logo512.png">
<link rel="apple-touch-icon" href="/icons/logo192.png">
  
  <link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#3b82f6">

      <script src="/js/i18n-auto-translate.js"></script>
  
   <script src="/js/noscroll.js"></script>

    <style>
    
        html, body {
  overscroll-behavior-y: none;
  overscroll-behavior-x: none;
}

body {
  position: relative;
  width: 100%;
  height: 100vh;
  overflow-x: hidden;
}

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f14;
            color: white;
            padding: 2rem;
            text-align: center;
        }
        .status {
            font-size: 3rem;
            margin: 2rem 0;
        }
        .info {
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 2rem;
            margin: 1rem auto;
            max-width: 600px;
            text-align: left;
        }
        .success { color: #00ff00; }
        .error { color: #ff0000; }
    </style>
</head>
<body>
    <h1>🧪 Test Script Inline</h1>
    <div class="status" id="status">⏳ Probando...</div>
    <div class="info" id="info"></div>

    <script>
        // Script INLINE - se ejecuta directamente sin cargar archivo externo
        (function() {
            const infoEl = document.getElementById('info');
            const statusEl = document.getElementById('status');
            
            // Test 1: Verificar que JavaScript funciona
            infoEl.innerHTML += '<p><strong>✅ JavaScript está funcionando</strong></p>';
            
            // Test 2: Verificar localStorage
            try {
                const testUser = localStorage.getItem('chainfeed_user');
                if (testUser) {
                    const user = JSON.parse(testUser);
                    infoEl.innerHTML += `<p><strong>✅ Usuario en localStorage:</strong> ${user.username} (ID: ${user.id})</p>`;
                } else {
                    infoEl.innerHTML += '<p><strong>ℹ️ No hay usuario en localStorage</strong></p>';
                }
            } catch (e) {
                infoEl.innerHTML += `<p><strong>❌ Error con localStorage:</strong> ${e.message}</p>`;
            }
            
            // Test 3: Verificar fetch
            fetch('/php/check_user_block.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({})
            })
            .then(r => r.json())
            .then(data => {
                infoEl.innerHTML += `<p><strong>✅ Endpoint accesible:</strong> ${data.message}</p>`;
                statusEl.innerHTML = '✅';
                statusEl.className = 'status success';
            })
            .catch(error => {
                infoEl.innerHTML += `<p><strong>❌ Error al consultar endpoint:</strong> ${error.message}</p>`;
                statusEl.innerHTML = '❌';
                statusEl.className = 'status error';
            });
            
            // Test 4: Verificar si el script externo se cargó
            setTimeout(() => {
                if (typeof window.testBlockCheck === 'function') {
                    infoEl.innerHTML += '<p><strong>✅ Script block-check.js CARGADO</strong></p>';
                } else {
                    infoEl.innerHTML += '<p><strong>❌ Script block-check.js NO CARGADO</strong></p>';
                    infoEl.innerHTML += '<p>Posibles causas:</p>';
                    infoEl.innerHTML += '<ul>';
                    infoEl.innerHTML += '<li>El archivo no está en /js/block-check.js</li>';
                    infoEl.innerHTML += '<li>Hay un error de sintaxis en el archivo</li>';
                    infoEl.innerHTML += '<li>El navegador tiene caché</li>';
                    infoEl.innerHTML += '<li>El script no está incluido en el HTML</li>';
                    infoEl.innerHTML += '</ul>';
                }
            }, 1000);
            
        })();
    </script>

    <!-- Intentar cargar el script externo -->
    <script src="/js/block-check.js" onerror="document.getElementById('info').innerHTML += '<p><strong>❌ ERROR AL CARGAR: /js/block-check.js no existe o no es accesible</strong></p>'"></script>
    
    <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/service-worker.js')  // ✅ CORRECTO
                .then(registration => {
                    console.log('✅ Service Worker registrado:', registration.scope);
                })
                .catch(error => {
                    console.error('❌ Error registrando Service Worker:', error);
                });
        });
    }
</script>

</body>
</html>
