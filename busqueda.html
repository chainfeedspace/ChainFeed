<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
        <meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

    <script>
    (function() {
        var theme = localStorage.getItem('chainfeed_theme') || 'dark';
        document.documentElement.className = theme + '-theme';
        document.documentElement.setAttribute('data-theme', theme);
        
        if (theme === 'light') {
            var s = document.createElement('style');
            s.id = 'preload-theme';
            s.textContent = ':root{--dark:#f0f0eb;--dark-secondary:#e5e5db;--dark-tertiary:#dadacd;--text-primary:#875ba9;--primary:#4f46e5}body,html{background:#f0f0eb!important}';
            document.head.appendChild(s);
        }
    })();
    </script>
    
    <title>ChainFeed - Buscar Usuarios</title>
    
<link rel="icon" type="image/png" sizes="192x192" href="/icons/logo192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icons/logo512.png">
<link rel="apple-touch-icon" href="/icons/logo192.png">
  
  <link rel="manifest" href="/manifest.json">
<!-- Theme color para modo oscuro (default) -->
<meta name="theme-color" content="#0F0F14">

<!-- Theme color para modo claro -->
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">

<!-- Theme color para modo oscuro (explícito) -->
<meta name="theme-color" content="#0F0F14" media="(prefers-color-scheme: dark)">

      <script src="/js/i18n-auto-translate.js"></script>
      
       <script src="/js/noscroll.js"></script>

<script src="/js/pwa-block.js"></script>

    <style>
    
    /* Prevenir flash de tema */
body {
    transition: opacity 0.15s ease-in;
}

/* Mientras carga el tema, ocultar brevemente */
body:not(.light-theme):not(.dark-theme) {
    opacity: 0;
}

body.light-theme,
body.dark-theme {
    opacity: 1;
}

        html, body {
  overscroll-behavior-y: none;
  overscroll-behavior-x: none;
}

body {
  position: relative;
  width: 100%;
  height: 100vh;
  overflow-x: hidden;
}

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        /* Reglas globales para quitar efectos de parpadeo */
        button, a, .clickable {
            outline: none;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        button:focus, a:focus, .clickable:focus {
            outline: none;
        }

        button:active, a:active, .clickable:active {
            outline: none;
        }

        :root {
            --primary: #6366f1;
            --secondary: #a855f7;
            --accent: #ec4899;
            --dark: #0f0f14;
            --dark-secondary: #1a1a24;
            --dark-tertiary: #252532;
            --text: #ffffff;
            --text-secondary: #a0a0b8;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: rgba(1, 1, 1, 1);
            color: var(--text);
            overflow-x: hidden;
            line-height: 1.6;
            min-height: 100vh;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--dark-secondary);
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 4px;
        }

        /* Fondo animado */
        .bg-animation {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
            background: rgba(1, 1, 1, 1);
            background-size: 400% 400%;
            animation: gradientShift 20s ease infinite;
            opacity: 0.05;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Navbar Fija */
        .navbar {
position: fixed;
    top: 0;
    width: 100%;
    background: rgba(0, 0, 0, 0.74);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    z-index: 1000;
    padding: 1rem 2rem;
    transition: all 0.3s 
ease;
        }

        @media (max-width: 768px) {
    .navbar {
        padding: 2px 1rem 2px 2px;
    }
}

        .navbar.scrolled {
    background: rgba(15, 15, 20, 0.16);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .nav-container {
    max-width: 1400px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 0.5rem;
        }

        .logo {
    font-size: 0.95rem;
    font-weight: 800;
    background: var(--text-secondary);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    display: flex;
    align-items: center;
    cursor: pointer;
    transition: transform 0.3s 
ease;
        }

        .logo:hover {
            transform: scale(1.05);
        }

        .logo img {
    height: 34px;
    vertical-align: middle;
    margin-right: 2px;
}

        @keyframes logoGlow {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.5); }
        }

        .nav-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-shrink: 0;
        }

        .nav-btn {
            background: rgb(99 102 241 / 3%);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: var(--primary);
            padding: 0 0.4rem;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            border: none;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            position: relative;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .nav-btn:hover {
            background: rgba(99, 102, 241, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(99, 102, 241, 0.3);
        }

        .nav-btn.active {
            background: rgba(99, 102, 241, 0.3);
            color: var(--text);
        }

      .notification-badge {
    position: absolute;
    top: -5px;
    right: -5px;
    background: var(--error);
    color: white;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.7rem;
    font-weight: 600;
    border: 2px solid var(--dark);
    opacity: 0; /* ⬅️ Invisible por defecto */
    visibility: hidden;
    transition: opacity 0.2s ease;
}

.notification-badge:not(.empty) {
    opacity: 1; /* ⬅️ Solo visible cuando NO tiene clase 'empty' */
    visibility: visible;
}

        @keyframes pulse {
            0% { 
                transform: scale(1); 
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
            }
            70% { 
                transform: scale(1.1); 
                box-shadow: 0 0 0 8px rgba(239, 68, 68, 0);
            }
            100% { 
                transform: scale(1); 
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
            }
        }

        /* Main Content */
        .main-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 120px 2rem 2rem;
            min-height: 100vh;
        }

        /* Search Header */
        .search-header {
            text-align: center;
            margin-bottom: 3rem;
            animation: slideDown 0.6s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .search-title {
            font-size: 3rem;
            font-weight: 800;
            color: rgba(192, 199, 215, 1);
            background-clip: text;
            margin-bottom: 1rem;
        }

        .search-subtitle {
            color: var(--text-secondary);
            font-size: 1.2rem;
            margin-bottom: 2rem;
        }

        /* Search Bar */
        .search-container {
            position: relative;
            max-width: 600px;
            margin: 0 auto 2rem;
            animation: slideUp 0.6s ease 0.2s both;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .search-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-input {
            width: 100%;
            background: rgba(26, 26, 36, 0.5);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            padding: 1.2rem 4rem 1.2rem 3rem;
            color: var(--text);
            font-size: 1.1rem;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.3);
            background: rgba(26, 26, 36, 0.8);
        }

        .search-input::placeholder {
            color: var(--text-secondary);
        }

        .search-icon {
            position: absolute;
            left: 1.2rem;
            color: var(--primary);
            font-size: 1.2rem;
            pointer-events: none;
        }

        .clear-search {
            position: absolute;
            right: 1.2rem;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 50%;
            transition: all 0.3s ease;
            opacity: 0;
            visibility: hidden;
        }

        .clear-search.visible {
            opacity: 1;
            visibility: visible;
        }

        .clear-search:hover {
            color: var(--error);
            background: rgba(239, 68, 68, 0.1);
        }

        /* Search Results */
        .search-results {
            animation: slideUp 0.6s ease 0.4s both;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding: 0 1rem;
        }

        .results-count {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        .sort-dropdown-container {
            position: relative;
            display: inline-block;
        }

        .sort-dropdown-btn {
            background: rgba(26, 26, 36, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 0.8rem 1.2rem;
            color: var(--text);
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            min-width: 160px;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .sort-dropdown-btn:hover {
            background: rgba(26, 26, 36, 0.8);
            border-color: var(--primary);
            box-shadow: 0 5px 15px rgba(99, 102, 241, 0.2);
            transform: translateY(-2px);
        }

        .sort-dropdown-btn:focus {
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.3);
        }

        .sort-dropdown-btn.active {
            border-color: var(--primary);
            background: rgba(26, 26, 36, 0.8);
        }

        .dropdown-arrow {
            color: var(--primary);
            font-size: 0.8rem;
            transition: transform 0.3s ease;
        }

        .sort-dropdown-btn.active .dropdown-arrow {
            transform: rotate(180deg);
        }

        .sort-dropdown-menu {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: rgba(26, 26, 36, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            margin-top: 0.5rem;
            padding: 0.5rem;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .sort-dropdown-menu.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .sort-option {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.7rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: var(--text);
            font-size: 0.9rem;
        }

        .sort-option:hover {
            background: rgba(99, 102, 241, 0.1);
            color: var(--primary);
        }

        .sort-option.active {
            background: rgba(99, 102, 241, 0.2);
            color: var(--primary);
        }

        .sort-option.active .option-check {
            opacity: 1;
        }

        .option-check {
            color: var(--primary);
            font-size: 0.8rem;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .option-text {
            flex: 1;
        }

        /* User Grid */
        .users-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .user-card {
            background: rgba(26, 26, 36, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 1.5rem;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            animation: cardAppear 0.5s ease;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .user-card:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 20px 40px rgba(99, 102, 241, 0.2);
            border-color: rgba(99, 102, 241, 0.3);
        }

        .user-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            transition: left 0.8s ease;
        }

        .user-card:hover::before {
            left: 100%;
        }

        .user-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .user-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            position: relative;
            flex-shrink: 0;
            overflow: hidden;
        }

        .user-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .user-online {
            position: absolute;
            bottom: -2px;
            right: -2px;
            width: 20px;
            height: 20px;
            background: var(--success);
            border-radius: 50%;
            border: 3px solid var(--dark-secondary);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }

        .user-info {
            flex: 1;
            min-width: 0;
        }

        .user-name {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 0.3rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .verified-badge {
            color: var(--primary);
            font-size: 1rem;
        }

        .user-username {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 0.3rem;
        }

        .user-stats {
            display: flex;
            gap: 1rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .user-bio {
            margin: 1rem 0 1.5rem 0;
            font-size: 0.9rem;
            line-height: 1.5;
            color: var(--text-secondary);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .user-actions {
            display: flex;
            gap: 0.8rem;
            align-items: center;
        }

        .follow-btn {
            flex: 2;
            min-width: 120px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 0.7rem 1.5rem;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .follow-btn::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255,255,255,0.3);
            transition: left 0.5s ease;
        }

        .follow-btn:hover::before {
            left: 100%;
        }

        .follow-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
        }

        .follow-btn.following {
            background: rgba(99, 102, 241, 0.2);
            color: var(--primary);
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        .follow-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .secondary-actions {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .action-btn {
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: var(--primary);
            padding: 0.6rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            font-weight: 600;
        }

        .action-btn:hover {
            background: rgba(99, 102, 241, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(99, 102, 241, 0.3);
        }

        .action-btn.tip-btn {
            background: rgba(16, 185, 129, 0.1);
            border-color: rgba(16, 185, 129, 0.3);
            color: var(--success);
        }

        .action-btn.tip-btn:hover {
            background: rgba(16, 185, 129, 0.2);
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.3);
        }

        /* Indicador de tokens CFT */
        .cft-indicator {
            color: #ffffffd6;
            padding: 0.3rem 0.8rem;
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            margin-left: 0.5rem;
        }

        .cft-indicator::before {
            content: "⚡";
            font-size: 0.9rem;
        }

        /* Estados especiales */
        .loading-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(99, 102, 241, 0.3);
            border-left: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-secondary);
        }

        .empty-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .empty-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text);
        }

        .empty-description {
            font-size: 1rem;
            line-height: 1.6;
        }

        /* Load More Button */
        .load-more-section {
            text-align: center;
            margin-top: 3rem;
        }

        .load-more-btn {
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: var(--primary);
            padding: 1rem 2rem;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .load-more-btn:hover {
            background: rgba(99, 102, 241, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(99, 102, 241, 0.3);
        }

        .load-more-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Responsive */
        @media (max-width: 768px) {

            .main-content {
                padding: 80px 1rem 2rem;
            }

            .search-title {
                font-size: 2rem;
            }

            .search-subtitle {
                font-size: 1rem;
            }

            .search-input {
                padding: 1rem 3.5rem 1rem 2.5rem;
                font-size: 1rem;
            }

            .results-header {
                flex-direction: column;
                gap: 1rem;
                align-items: stretch;
            }

            .sort-dropdown-btn {
                width: 100%;
                justify-content: center;
            }

            .sort-dropdown-menu {
                left: 0;
                right: 0;
            }

            .users-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }

            .user-card {
                padding: 1.2rem;
            }

            .user-actions {
                gap: 1rem;
            }

            .secondary-actions {
                min-width: 120px;
                justify-content: space-between;
            }

            .action-btn {
                flex: 2;
                justify-content: center;
            }

        }

        /* Animaciones de entrada escalonadas */
        .user-card:nth-child(1) { animation-delay: 0.1s; }
        .user-card:nth-child(2) { animation-delay: 0.2s; }
        .user-card:nth-child(3) { animation-delay: 0.3s; }
        .user-card:nth-child(4) { animation-delay: 0.4s; }
        .user-card:nth-child(5) { animation-delay: 0.5s; }
        .user-card:nth-child(6) { animation-delay: 0.6s; }

        /* Estados de filtros */
        .hidden {
            display: none !important;
        }

        /* Efecto de highlight para búsqueda */
        .highlight {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
